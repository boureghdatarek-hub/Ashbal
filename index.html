<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white p-8">

    <div class="flex justify-center gap-4 mb-8">
        <button onclick="loadContent('شروط')" class="bg-amber-600 hover:bg-amber-700 px-6 py-2 rounded-lg font-bold transition">شروط القبول</button>
        <button onclick="loadContent('خارطة')" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold transition">خارطة المسابقة</button>
        <button onclick="loadContent('وثائق')" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2 rounded-lg font-bold transition">الوثائق المطلوبة</button>
        <button onclick="loadContent('نصائح')" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg font-bold transition">نصائح التفوق</button>
    </div>

    <div id="contentDisplay" class="max-w-4xl mx-auto p-8 bg-slate-800 rounded-2xl border border-slate-700 min-h-[300px] shadow-xl">
        <h2 class="text-2xl font-bold text-center text-slate-400 mt-20">اختر قسماً من القائمة أعلاه لعرض التفاصيل هنا</h2>
    </div>

    <script>
        function loadContent(section) {
            const display = document.getElementById('contentDisplay');
            const data = {
                'شروط': `
                    <h3 class="text-2xl font-bold text-amber-500 mb-6">⚖️ شروط القبول</h3>
                    <ul class="space-y-3 text-lg text-slate-200">
                        <li>• أن يكون المترشح جزائري الجنسية.</li>
                        <li>• التمتع بلياقة بدنية ممتازة واجتياز الفحص الطبي.</li>
                        <li>• حيازة شهادة التعليم المتوسط بمعدل ممتاز.</li>
                    </ul>`,
                'خارطة': `
                    <h3 class="text-2xl font-bold text-blue-500 mb-6">🗺️ خارطة المسابقة</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                        <div class="bg-slate-700 p-4 rounded-lg">1. الانتقاء الأولي</div>
                        <div class="bg-slate-700 p-4 rounded-lg">2. الاختبارات الكتابية</div>
                        <div class="bg-slate-700 p-4 rounded-lg">3. الفحص الطبي والرياضي</div>
                    </div>`,
                'وثائق': `
                    <h3 class="text-2xl font-bold text-emerald-500 mb-6">📂 الوثائق المطلوبة</h3>
                    <ul class="space-y-2 text-slate-200">
                        <li>✅ الإستدعاء</li>
                        <li>✅ نسخة من كشف النقاط السنوي</li>
                        <li>✅ بطاقة التعريف أو المدرسية</li>
                        <li>✅ شهادة الميلاد وبدلة الرياضة</li>
                        <li>✅ ملف التحاليل الطبية (تحليل بول، دم، كلى، كبدي، قلب، وأشعة صدرية)</li>
                    </ul>`,
                'نصائح': `
                    <h3 class="text-2xl font-bold text-purple-500 mb-6">💡 مفاتيح التفوق</h3>
                    <p class="text-xl text-slate-300 italic">"التخطيط الجيد يختصر نصف الطريق نحو النجاح."</p>
                    <ul class="mt-4 space-y-2 text-slate-200">
                        <li>• ركز على مراجعة الرياضيات والفيزياء.</li>
                        <li>• حل نماذج السنوات السابقة للتعود على نمط الأسئلة.</li>
                    </ul>`
            };
            display.innerHTML = data[section];
        }
    </script>
</body>
</html>
