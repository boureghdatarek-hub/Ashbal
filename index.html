<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">

    <div class="flex flex-wrap justify-center gap-2 mb-8">
        <button onclick="loadContent('شروط')" class="bg-slate-700 hover:bg-amber-600 px-5 py-2 rounded-lg font-bold transition">الشروط</button>
        <button onclick="loadContent('خارطة')" class="bg-slate-700 hover:bg-blue-600 px-5 py-2 rounded-lg font-bold transition">خارطة المسابقة</button>
        <button onclick="loadContent('وثائق')" class="bg-amber-600 px-5 py-2 rounded-lg font-bold transition">الوثائق المطلوبة</button>
        <button onclick="loadContent('نصائح')" class="bg-slate-700 hover:bg-purple-600 px-5 py-2 rounded-lg font-bold transition">نصائح</button>
    </div>

    <div id="contentDisplay" class="max-w-3xl mx-auto p-6 bg-slate-900 rounded-2xl border border-slate-700 shadow-xl min-h-[300px]">
        <h2 class="text-xl text-center text-slate-500 mt-20">مرحباً بك، اضغط على أحد الأزرار أعلاه لعرض التفاصيل.</h2>
    </div>

    <script>
        function loadContent(section) {
            const display = document.getElementById('contentDisplay');
            
            const contentData = {
                'شروط': `<h3 class="text-2xl font-bold text-amber-500 mb-4">⚖️ شروط القبول</h3>
                         <ul class="space-y-2"><li>• أن يكون المترشح جزائري الجنسية.</li><li>• التمتع بلياقة بدنية ممتازة.</li><li>• حيازة شهادة التعليم المتوسط بمعدل جيد.</li></ul>`,
                'خارطة': `<h3 class="text-2xl font-bold text-blue-500 mb-4">🗺️ خارطة المسابقة</h3>
                          <p>تمر المسابقة عبر ثلاث مراحل: الانتقاء الأولي، الاختبارات الكتابية، ثم الفحص الطبي والرياضي.</p>`,
                'وثائق': `<h3 class="text-2xl font-bold text-emerald-500 mb-4">📂 الوثائق المطلوبة</h3>
                          <ul class="space-y-1 text-sm"><li>✅ الاستدعاء</li><li>✅ كشف النقاط السنوي</li><li>✅ بطاقة التعريف أو المدرسية</li><li>✅ شهادة الميلاد</li><li>✅ بدلة الرياضة</li><li>✅ ملف التحاليل الطبية (بول، دم، سكر، كلى، كبد، قلب، أشعة صدرية)</li></ul>`,
                'نصائح': `<h3 class="text-2xl font-bold text-purple-500 mb-4">💡 نصائح للمترشح</h3>
                          <p>التخطيط الجيد والتدريب المستمر على حل مواضيع السنوات السابقة هو سر التفوق.</p>`
            };

            display.innerHTML = contentData[section] || 'عذراً، المحتوى غير متوفر.';
        }
    </script>
</body>
</html>
