<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التحضير الفردي التفاعلية | أشبال الأمة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <main class="flex-grow max-w-5xl w-full mx-auto p-4 sm:p-6">
        
        <div id="navTabs" class="flex justify-center gap-2 mb-6 max-w-md mx-auto w-full">
            <button onclick="switchTab('quiz')" id="tabQuiz" class="flex-1 py-2 px-4 rounded-xl text-sm font-bold bg-amber-500 text-slate-950">🎯 مسابقات المراجعة</button>
            <button onclick="switchTab('guide')" id="tabGuide" class="flex-1 py-2 px-4 rounded-xl text-sm font-bold text-slate-400 bg-slate-800 border border-slate-700/30">📜 دليل التحضير</button>
        </div>

        <div id="sectionQuiz" class="space-y-6">
            <div id="subjectView" class="bg-slate-800/40 border border-slate-700/40 rounded-3xl p-8 text-center">
                <h2 class="text-2xl font-black mb-6">اختر مادة لمراجعتها</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-3xl mx-auto">
                    <button onclick="startQuiz('math')" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 hover:border-amber-500 transition">📐 الرياضيات</button>
                    <button onclick="startQuiz('arabic')" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 hover:border-amber-500 transition">✍️ اللغة العربية</button>
                </div>
            </div>

            <div id="quizView" class="hidden bg-slate-800/40 border border-slate-700/40 rounded-3xl p-8 max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                    <h2 id="subjectTitle" class="font-black text-amber-400"></h2>
                    <button onclick="exitQuiz()" class="text-xs bg-slate-700 px-3 py-1 rounded-xl">خروج</button>
                </div>
                <div id="questionText" class="text-lg font-bold mb-6"></div>
                <div id="optionsContainer" class="grid grid-cols-1 gap-3"></div>
            </div>
        </div>
    </main>

    <script>
        const quizDatabase = {
            math: { title: "الرياضيات", questions: [{ q: "محيط مستطيل طوله 40 وعرضه 20؟", a: ["120", "100"], c: 0 }] },
            arabic: { title: "اللغة العربية", questions: [{ q: "إعراب العلم في 'العلم ينير'؟", a: ["مبتدأ", "فاعل"], c: 0 }] }
        };

        function switchTab(tab) {
            document.getElementById('sectionQuiz').classList.toggle('hidden', tab !== 'quiz');
        }

        function startQuiz(subjectKey) {
            currentSubject = subjectKey;
            document.getElementById('subjectView').classList.add('hidden');
            document.getElementById('quizView').classList.remove('hidden');
            document.getElementById('subjectTitle').innerText = quizDatabase[subjectKey].title;
            renderQuestion();
        }

        function renderQuestion() {
            const q = quizDatabase[currentSubject].questions[0];
            document.getElementById('questionText').innerText = q.q;
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            q.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-700 p-3 rounded-xl hover:bg-slate-600";
                btn.innerText = opt;
                btn.onclick = () => alert("تم الاختيار!");
                container.appendChild(btn);
            });
        }

        function exitQuiz() {
            document.getElementById('subjectView').classList.remove('hidden');
            document.getElementById('quizView').classList.add('hidden');
        }
    </script>
</body>
</html>
