<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>منصة الاختبارات التعليمية</title>
</head>
<body class="bg-gray-100 p-5">

    <!-- واجهة المواد -->
    <div id="subjectView" class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center">اختر المادة للبدء</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="startQuiz('math')" class="p-6 bg-blue-500 text-white rounded-lg shadow-lg hover:bg-blue-600">الرياضيات</button>
            <button onclick="startQuiz('science')" class="p-6 bg-green-500 text-white rounded-lg shadow-lg hover:bg-green-600">العلوم</button>
        </div>
    </div>

    <!-- واجهة الاختبار -->
    <div id="quizView" class="hidden max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 id="quizTitle" class="text-2xl font-bold mb-4"></h2>
        <div id="questionContainer" class="mb-6"></div>
        <div id="result" class="text-xl font-bold text-center"></div>
    </div>

    <script>
        const quizDatabase = {
            math: [
                { q: "كم يساوي 2 + 2؟", a: ["3", "4", "5"], correct: "4" },
                { q: "ما هو جذر 16؟", a: ["2", "4", "8"], correct: "4" }
            ],
            science: [
                { q: "ما هو رمز الماء الكيميائي؟", a: ["H2O", "CO2", "O2"], correct: "H2O" }
            ]
        };

        let currentData = [];
        let currentIndex = 0;
        let score = 0;

        function startQuiz(subject) {
            currentData = quizDatabase[subject];
            currentIndex = 0;
            score = 0;
            document.getElementById('subjectView').classList.add('hidden');
            document.getElementById('quizView').classList.remove('hidden');
            document.getElementById('quizTitle').innerText = "اختبار " + subject;
            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('questionContainer');
            if (currentIndex < currentData.length) {
                const item = currentData[currentIndex];
                container.innerHTML = `
                    <p class="mb-4 text-lg">${item.q}</p>
                    ${item.a.map(opt => `<button onclick="checkAnswer('${opt}')" class="block w-full p-2 mb-2 bg-gray-200 hover:bg-gray-300 rounded">${opt}</button>`).join('')}
                `;
            } else {
                document.getElementById('quizView').innerHTML = `<h2 class="text-center text-3xl">نتيجتك النهائية: ${score} / ${currentData.length}</h2>`;
            }
        }

        function checkAnswer(ans) {
            if (ans === currentData[currentIndex].correct) score++;
            currentIndex++;
            renderQuestion();
        }
    </script>
</body>
</html>
